name: Security

# Source scans. deploy.yml calls this file for every push to main or staging and every pull request,
# and its `publish` job needs it. The image scan is not here: it runs in deploy.yml, on the exact
# image that gets pushed. This file also runs weekly, to catch advisories published after the last
# push, and rebuilds the image from the default branch for that.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Pinned, bump together with a review of the new release. sha256 is of the linux amd64 archive.
  GOVULNCHECK_VERSION: v1.9.0
  GOLANGCI_LINT_VERSION: 2.15.0
  GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Fails only on vulnerabilities whose vulnerable symbol this code can reach.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest 1.27 patch, not the go.mod floor (1.26.0): the stdlib fixes land in patch releases and
          # govulncheck fails on a reachable stdlib advisory. go.mod keeps its directive.
          go-version: 1.27.x
          check-latest: true

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" -tags integration ./...

  # gosec only, config in .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest 1.27 patch, not the go.mod floor (1.26.0): the stdlib fixes land in patch releases and
          # govulncheck fails on a reachable stdlib advisory. go.mod keeps its directive.
          go-version: 1.27.x
          check-latest: true

      - name: Install golangci-lint (pinned, checksum verified)
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/golangci-lint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" --strip-components=1 "golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64/golangci-lint"

      - name: golangci-lint (gosec)
        run: '"$RUNNER_TEMP/golangci-lint" run --build-tags integration'

  # Whole history, not only the new commits: a secret that was removed later is still leaked.
  # Exceptions: .gitleaksignore.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact -v .'

  # Weekly run only. Push and pull request runs scan the image in deploy.yml. The event name inside a
  # called workflow is the caller's, so this cannot run twice for them.
  image:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ceruvia/grader:scan
          cache-from: type=gha,scope=grader-test

      - uses: ./.github/actions/grype-scan
        with:
          image: docker:ceruvia/grader:scan
