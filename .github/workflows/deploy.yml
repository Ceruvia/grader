name: Build and publish grader image

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The suite calls isolate, so it runs in the grader image (systemd PID 1, cgroup v2), not on the
  # bare runner. This is the same command sequence as AGENTS.md "Grader test run".
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: ceruvia/grader:test
          cache-from: type=gha,scope=grader-test
          cache-to: type=gha,mode=max,scope=grader-test

      - name: Start grader container
        run: |
          docker run -d --name grader-test --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw ceruvia/grader:test

      - name: Wait for isolate
        run: |
          for _ in $(seq 60); do
            docker exec grader-test systemctl is-active --quiet isolate.service && exit 0
            sleep 1
          done
          docker logs grader-test | tail -50
          echo "isolate.service did not become active within 60 s" >&2
          exit 1

      - name: Go vet and tests
        run: docker exec -w /src grader-test sh -c 'go vet ./... && go test ./...'

      - name: Remove container
        if: always()
        run: docker rm -f grader-test

  publish:
    # Pull requests only run the test job above.
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ github.ref_name == 'main' }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      # No --target: the default (last) stage is `runtime`, without the Go toolchain.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
