# Security lint only: gosec at high confidence. Style linters are not part of this gate.
# Test files are skipped: they are not shipped, and their file modes and subprocesses are noise.
# To widen: lower confidence to medium, review the findings, fix them, then commit.
version: "2"
run:
  tests: false
linters:
  default: none
  enable:
    - gosec
  settings:
    gosec:
      confidence: high
      severity: medium
issues:
  # 0 means no cap. The defaults hide findings after 3 of the same kind and 50 per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
